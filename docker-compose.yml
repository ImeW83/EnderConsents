
services:
  postgres:
    image: postgres:16
    container_name: enderconsents-db
    restart: always
    environment:
      POSTGRES_USER: enderconsents
      POSTGRES_PASSWORD: enderconsents_dev_password
      POSTGRES_DB: enderconsents
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: enderconsents-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: